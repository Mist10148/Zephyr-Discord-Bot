services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zephyr
      POSTGRES_USER: zephyr
      POSTGRES_PASSWORD: zephyr
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zephyr -d zephyr"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - redis_data:/data

  web:
    build: .
    command: gunicorn wsgi:app --bind 0.0.0.0:5000
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+psycopg://zephyr:zephyr@postgres:5432/zephyr
      # OAuth redirect base for local runs. DISCORD_CLIENT_ID and
      # DISCORD_CLIENT_SECRET arrive via env_file above.
      - WEB_PUBLIC_URL=http://localhost:5000
      - AUTH_COOKIE_SECURE=0
    depends_on:
      # service_healthy, not service_started: Redis now holds dashboard sessions,
      # and a started-but-not-yet-listening Redis would fail the first sign-in.
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  bot:
    build: .
    command: python run_bot.py
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+psycopg://zephyr:zephyr@postgres:5432/zephyr
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  redis_data:
  postgres_data:
