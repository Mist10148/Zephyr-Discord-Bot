services:
  - type: web
    name: zephyr-website
    runtime: python
    plan: free
    buildCommand: npm --prefix website/frontend ci && npm --prefix website/frontend run build && pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:${PORT:-5000} --workers 2 --threads 4
    envVars:
      - key: WEB_APP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: zephyr-db
          property: connectionString
      # Dashboard sessions are server-side and shared across the two workers
      # above, so the web service needs Redis just as much as the bot does.
      # Without this the dashboard boots with auth silently disabled.
      - key: REDIS_URL
        fromService:
          name: zephyr-redis
          type: redis
          property: connectionString
      # Discord OAuth2 credentials, from the same application as the bot.
      # Register https://<your-host>/api/v1/auth/callback under OAuth2 -> Redirects.
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      # Only needed for a custom domain. Otherwise the redirect URI is derived
      # from RENDER_EXTERNAL_URL, which Render injects automatically.
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: NODE_VERSION
        value: "22"

  - type: worker
    name: zephyr-bot
    runtime: python
    plan: starter  # Background workers require a paid plan on Render
    buildCommand: pip install -r requirements.txt
    startCommand: python run_bot.py
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: WEB_APP_URL
        fromService:
          name: zephyr-website
          type: web
          property: url
      - key: REDIS_URL
        fromService:
          name: zephyr-redis
          type: redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: zephyr-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.13.0

  - type: redis
    name: zephyr-redis
    plan: free
    ipAllowList: []

databases:
  - name: zephyr-db
    plan: basic-256mb
    databaseName: zephyr
    user: zephyr
