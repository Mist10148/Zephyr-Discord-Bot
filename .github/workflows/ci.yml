name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/frontend/package-lock.json
      - run: npm --prefix website/frontend ci
      - run: npm --prefix website/frontend run lint
      - run: npm --prefix website/frontend run typecheck
      - run: npm --prefix website/frontend run test
      - run: npm --prefix website/frontend run build

  # The fourth job, and the only one with a service container.
  #
  # `tests/conftest.py` states the rule this breaks: no network, no Redis, no
  # Postgres, because CI runs no service containers. That rule earns its keep on
  # the backend job, where a Redis dependency would slow every unit test to buy
  # nothing. It cannot hold here: the dashboard exists only when REDIS_URL is
  # set, sessions live in Redis, and half of what this suite covers is behind
  # auth. The exception is argued, deliberate, and confined to this job -- the
  # backend job's guarantee is untouched.
  e2e:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379/9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/frontend/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: npm --prefix website/frontend ci
      # The real bundle, served by the real Flask app. `website/static/` is
      # gitignored, so without this the app answers 503 spa_not_built and every
      # spec fails on a blank page.
      - run: npm --prefix website/frontend run build
      - run: npx --prefix website/frontend playwright install --with-deps chromium
      - run: npm --prefix website/frontend run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: website/frontend/test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag zephyr:ci .
