<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Per-scheme theme-color so the mobile browser chrome matches the page in both
         light and dark, rather than a single dark bar over a light UI. -->
    <meta name="theme-color" content="#e9f0fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080b16" media="(prefers-color-scheme: dark)" />
    <!-- Set the theme class before first paint so there is no light-then-dark flash.
         Mirrors resolveTheme() in src/lib/theme.tsx: an explicit stored choice wins,
         otherwise follow the OS. Inlined (not imported) because it must run before
         the module bundle loads. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('zephyr-theme')
          var dark = stored === 'dark' || (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
    <meta name="description" content="Weather forecasts and Zephyr bot controls." />
    <link rel="icon" href="/icons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <!-- iOS ignores the web manifest and reads these instead, so an iPhone added to
         the home screen needs them or it gets a screenshot of the page as its icon. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zephyr" />
    <title>Zephyr Weather</title>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
