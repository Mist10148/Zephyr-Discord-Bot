<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Per-scheme theme-color so the mobile browser chrome matches the page in both
         light and dark, rather than a single dark bar over a light UI. -->
    <meta name="theme-color" content="#F0EEE6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1A1917" media="(prefers-color-scheme: dark)" />
    <!-- Set the theme class before first paint so there is no light-then-dark flash.
         Mirrors resolveTheme() in src/lib/theme.tsx: an explicit stored choice wins,
         otherwise follow the OS. Inlined (not imported) because it must run before
         the module bundle loads. -->
    <script src="/theme-init.js"></script>
    <meta name="description" content="Weather forecasts and Zephyr bot controls." />
    <link rel="icon" href="/icons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <!-- iOS ignores the web manifest and reads these instead, so an iPhone added to
         the home screen needs them or it gets a screenshot of the page as its icon. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zephyr" />
    <title>Zephyr — weather, music and AI for Discord</title>

    <!-- Open Graph and Twitter cards. Static, and that is not a shortcut: no
         unfurler runs JavaScript, so per-route social cards are impossible
         without server-side injection. These values describe the site, which is
         what a pasted link into Discord is about -- and a link to a Discord bot
         pasted into Discord was previously a bare URL, which is the
         highest-leverage missing markup on the whole site.

         RouteMeta (src/components/RouteMeta.tsx) handles the half a client can
         solve: the browser tab, history and bookmarks. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zephyr" />
    <meta property="og:title" content="Zephyr — weather, music and AI for Discord" />
    <meta property="og:description" content="Forecasts and heat-index advisories, a full music player, and an AI companion — with a dashboard to configure it all." />
    <meta property="og:image" content="/icons/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Zephyr — a weather-first Discord companion" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zephyr — weather, music and AI for Discord" />
    <meta name="twitter:description" content="Forecasts and heat-index advisories, a full music player, and an AI companion — with a dashboard to configure it all." />
    <meta name="twitter:image" content="/icons/og-card.png" />
    <link rel="canonical" href="/" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Zephyr</h1>
      <p>A weather-first Discord companion — forecasts and heat-index advisories, a
         music player, and an AI chat companion, with a dashboard to configure it.</p>
      <p>Zephyr needs JavaScript. These pages are readable without it:</p>
      <ul>
        <li><a href="/commands">Command reference</a></li>
        <li><a href="/privacy">Privacy</a></li>
        <li><a href="/terms">Terms</a></li>
      </ul>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
