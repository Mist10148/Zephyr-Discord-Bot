# Alembic configuration for Zephyr.
#
# The database URL is NOT set here.  zephyr/db/migrations/env.py reads it from
# DATABASE_URL (falling back to the local SQLite default) through the same
# normalisation that build_engine uses, so migrations and the application always
# agree on which database they are talking to.
#
# Migrations are not run automatically on deploy -- see docs/DEPLOYMENT.md.

[alembic]
script_location = zephyr/db/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
